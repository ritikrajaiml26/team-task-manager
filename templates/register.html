<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<style>
body {font-family:Arial;background:#6c5ce7;display:flex;justify-content:center;align-items:center;height:100vh;}
.box {background:white;padding:30px;border-radius:10px;width:320px;text-align:center;}
input {width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:5px;}
button {width:100%;padding:10px;background:#6c5ce7;color:white;border:none;border-radius:5px;}
.msg {color:red;}
</style>
</head>

<body>
<div class="box">
<h2>Register</h2>

<input id="full_name" placeholder="Full Name">
<input id="username" placeholder="Username">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>

<p class="msg" id="msg"></p>

<a href="/api/auth/login-page/">Login</a>
</div>

<script>
function register(){
    const username = document.getElementById("username").value
    const email = document.getElementById("email").value
    const password = document.getElementById("password").value
    const full_name = document.getElementById("full_name").value

    fetch("/api/auth/signup/",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username: username,
            email: email,
            password: password,
            first_name: full_name   // 🔥 IMPORTANT
        })
    })
    .then(res=>{
        if(!res.ok) throw new Error("Register Failed")
        return res.json()
    })
    .then(()=>{
        alert("Registered Successfully")
        window.location.href="/api/auth/login-page/"
    })
    .catch(e=>{
        document.getElementById("msg").innerText = e.message
    })
}
</script>
</body>
</html>
