<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login | Team Task Manager</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <main class="container">
    <div class="card form-card">
      <h2>User Login</h2>
      <p class="hero-copy">Access your personal workspace and track tasks assigned to you.</p>
      <input id="username" class="form-input" type="text" placeholder="Username">
      <input id="password" class="form-input" type="password" placeholder="Password">
      <div id="auth-error" class="form-error"></div>
      <button class="btn btn-primary" onclick="submitLogin('Member')">Login as User</button>
      <p class="form-meta">New here? <a href="register.html">Create an account</a> or <a href="admin-login.html">Admin login</a>.</p>
    </div>
  </main>
  <script src="./js/auth.js"></script>
</body>
</html>
